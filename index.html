<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIZUKI ICO CONVERTER</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--color-bg:#0a0a0a;
--color-surface:rgba(255,255,255,0.03);
--color-surface-hover:rgba(255,255,255,0.06);
--color-border:rgba(255,255,255,0.08);
--color-border-hover:rgba(255,255,255,0.15);
--color-text:#fff;
--color-text-secondary:rgba(255,255,255,0.5);
--color-text-muted:rgba(255,255,255,0.3);
--color-accent:#fff;
--font-main:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{font-size:16px}
body{
font-family:var(--font-main);
font-weight:400;line-height:1.5;
color:var(--color-text);
background:var(--color-bg);
min-height:100vh;
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}
.background-overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background-image:url('main.jpg');
background-size:cover;background-position:center;background-repeat:no-repeat;
filter:blur(20px) brightness(0.85);
opacity:0;z-index:-1;transition:opacity 1s ease;
}
.background-overlay.loaded{opacity:0.6}
.container{
max-width:960px;margin:0 auto;padding:60px 40px;
}
.header{
display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px;
padding-bottom:40px;border-bottom:1px solid var(--color-border);
}
.logo{display:flex;align-items:baseline;gap:16px}
.logo h1{font-size:32px;font-weight:700;letter-spacing:0.1em;color:var(--color-text)}
.logo-sub{font-size:14px;font-weight:300;letter-spacing:0.3em;color:var(--color-text-secondary);text-transform:uppercase}
.logo-icon{width:32px;height:32px;opacity:0.8}
.main-content{padding:60px 0}
.hero{margin-bottom:60px}
.hero h2{font-size:14px;font-weight:500;letter-spacing:0.4em;color:var(--color-text-secondary);margin-bottom:12px;text-transform:uppercase}
.hero p{font-size:28px;font-weight:300;letter-spacing:0.02em;color:var(--color-text);line-height:1.3}
.hero .supported-formats{font-size:12px;color:var(--color-text-muted);margin-top:16px;letter-spacing:0.05em}

.converter-area{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
@media(max-width:768px){.converter-area{grid-template-columns:1fr}}

.upload-zone{
background:var(--color-surface);
border:1px dashed var(--color-border);
padding:60px 32px;
text-align:center;
cursor:pointer;
transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
position:relative;
min-height:280px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.upload-zone:hover,.upload-zone.drag-over{
border-color:var(--color-text);
background:var(--color-surface-hover);
}
.upload-zone.has-image{border-style:solid;padding:24px}
.upload-icon{margin-bottom:20px;opacity:0.4}
.upload-icon svg{width:48px;height:48px;stroke:var(--color-text)}
.upload-text{font-size:15px;font-weight:500;letter-spacing:0.1em;color:var(--color-text-secondary);margin-bottom:8px}
.upload-hint{font-size:11px;color:var(--color-text-muted);letter-spacing:0.05em}
.upload-zone input[type=file]{display:none}

.preview-area{
background:var(--color-surface);
border:1px solid var(--color-border);
padding:32px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
min-height:280px;
}
.preview-area .placeholder{
font-size:12px;color:var(--color-text-muted);letter-spacing:0.1em;text-align:center
}
.preview-image{max-width:200px;max-height:200px;object-fit:contain;border:1px solid var(--color-border)}
.preview-info{margin-top:16px;font-size:11px;color:var(--color-text-secondary);letter-spacing:0.05em;text-align:center}

.resolution-section{margin-bottom:40px}
.section-title{font-size:11px;font-weight:500;letter-spacing:0.2em;color:var(--color-text-secondary);margin-bottom:16px;text-transform:uppercase}
.resolutions{display:flex;flex-wrap:wrap;gap:10px}
.resolution{
padding:10px 18px;background:transparent;
border:1px solid var(--color-border);
color:var(--color-text-secondary);
font-size:12px;font-weight:500;letter-spacing:0.08em;
cursor:pointer;
transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.resolution:hover{border-color:var(--color-border-hover);color:var(--color-text)}
.resolution.active{background:var(--color-text);border-color:var(--color-text);color:var(--color-bg)}
.resolution-presets{display:flex;gap:8px;margin-bottom:16px}
.preset-btn{
padding:8px 16px;background:transparent;
border:1px solid var(--color-border);
color:var(--color-text-muted);
font-size:10px;font-weight:500;letter-spacing:0.1em;
cursor:pointer;text-transform:uppercase;
transition:all 0.3s ease;
}
.preset-btn:hover{border-color:var(--color-border-hover);color:var(--color-text)}
.preset-btn.active{background:var(--color-text);border-color:var(--color-text);color:var(--color-bg)}
.divider{height:1px;background:var(--color-border);margin-bottom:40px}
.action-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.btn{
padding:14px 32px;
font-family:var(--font-main);
font-size:13px;font-weight:600;letter-spacing:0.1em;
cursor:pointer;border:none;
transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
text-transform:uppercase;
}
.btn-primary{background:var(--color-text);color:var(--color-bg)}
.btn-primary:hover{opacity:0.85}
.btn-primary:disabled{opacity:0.3;cursor:not-allowed}
.btn-secondary{
background:transparent;border:1px solid var(--color-border);color:var(--color-text)
}
.btn-secondary:hover{border-color:var(--color-text)}
.result-msg{margin-top:16px;font-size:13px;letter-spacing:0.05em}
.result-msg.success{color:#4caf50}
.result-msg.error{color:#f44336}
.ico-preview-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px}
.ico-preview-item{text-align:center}
.ico-preview-item img{border:1px solid var(--color-border);background:rgba(255,255,255,0.05);image-rendering:pixelated}
.ico-preview-item span{display:block;font-size:10px;color:var(--color-text-muted);margin-top:4px;letter-spacing:0.05em}
.footer{padding:60px 0 40px;border-top:1px solid var(--color-border);margin-top:80px;text-align:center}
.footer p{font-size:11px;font-weight:400;letter-spacing:0.1em;color:var(--color-text-muted)}
.footer a{color:var(--color-text-secondary);text-decoration:none;transition:color 0.3s ease}
.footer a:hover{color:var(--color-text)}
.beian{font-size:10px;letter-spacing:0.05em;color:var(--color-text-muted);margin-top:12px}
.beian a{color:var(--color-text-muted);text-decoration:none;transition:color 0.3s ease}
.beian a:hover{color:var(--color-text)}
</style>
</head>
<body>
<div class="background-overlay" id="bgOverlay"></div>
<div class="container">
<header class="header">
<div class="logo">
<img src="favicon.ico" class="logo-icon" alt="KIZUKI">
<h1>KIZUKI</h1>
<span class="logo-sub">ICO CONVERTER</span>
</div>
</header>

<main class="main-content">
<section class="hero">
<h2>在线转换ico图片</h2>
<p>将任意图片转换为 ICO 图标<br>支持多尺寸打包输出</p>
<p class="supported-formats">支持 PNG / JPG / BMP / GIF / WebP / SVG / TIFF 等格式</p>
</section>

<div class="converter-area">
<div class="upload-zone" id="uploadZone">
<div class="upload-icon"><svg viewBox="0 0 48 48" fill="none" stroke-width="1.5"><path d="M24 36V12M24 12L16 20M24 12L32 20"/><path d="M8 28v12a4 4 0 004 4h24a4 4 0 004-4V28"/></svg></div>
<div class="upload-text">丢图片到这里</div>
<div class="upload-hint">或点击选择文件</div>
<input type="file" id="fileInput" accept="image/*">
</div>
<div class="preview-area" id="previewArea">
<div class="placeholder">预览中心</div>
</div>
</div>

<div class="divider"></div>

<div class="resolution-section">
<div class="resolution-presets">
<button class="preset-btn active" data-preset="standard">Standard</button>
<button class="preset-btn" data-preset="all">All Sizes</button>
<button class="preset-btn" data-preset="small">Small Only</button>
<button class="preset-btn" data-preset="large">Large Only</button>
<button class="preset-btn" data-preset="custom">Custom</button>
</div>
<div class="section-title">Select Resolutions</div>
<div class="resolutions" id="resolutionGroup">
<button class="resolution active" data-size="16">16x16</button>
<button class="resolution active" data-size="32">32x32</button>
<button class="resolution" data-size="24">24x24</button>
<button class="resolution" data-size="48">48x48</button>
<button class="resolution" data-size="64">64x64</button>
<button class="resolution active" data-size="128">128x128</button>
<button class="resolution active" data-size="256">256x256</button>
</div>
</div>

<div class="action-bar">
<button class="btn btn-primary" id="convertBtn" disabled>Generate ICO</button>
<button class="btn btn-secondary" id="resetBtn">Reset</button>
</div>
<div class="result-msg" id="resultMsg"></div>
<div class="ico-preview-grid" id="icoPreviewGrid"></div>
</main>

<footer class="footer">
<p>2026 KIZUKI TECHNOLOGY. ALL RIGHTS RESERVED.</p>
</footer>
</div>

<script>
(function(){
const uploadZone=document.getElementById('uploadZone');
const fileInput=document.getElementById('fileInput');
const previewArea=document.getElementById('previewArea');
const convertBtn=document.getElementById('convertBtn');
const resetBtn=document.getElementById('resetBtn');
const resultMsg=document.getElementById('resultMsg');
const icoPreviewGrid=document.getElementById('icoPreviewGrid');
const resolutionGroup=document.getElementById('resolutionGroup');
const presetBtns=document.querySelectorAll('.preset-btn');

let currentImage=null;
let currentImageData=null;

const presets={
standard:[16,32,128,256],
all:[16,24,32,48,64,128,256],
small:[16,24,32,48],
large:[64,128,256],
custom:null
};

let activePreset='standard';

uploadZone.addEventListener('click',(e)=>{if(e.target!==fileInput)fileInput.click()});
uploadZone.addEventListener('dragover',(e)=>{e.preventDefault();uploadZone.classList.add('drag-over')});
uploadZone.addEventListener('dragleave',()=>{uploadZone.classList.remove('drag-over')});
uploadZone.addEventListener('drop',(e)=>{
e.preventDefault();uploadZone.classList.remove('drag-over');
if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change',()=>{if(fileInput.files.length)handleFile(fileInput.files[0])});

presetBtns.forEach(btn=>{
btn.addEventListener('click',()=>{
presetBtns.forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
activePreset=btn.dataset.preset;
if(activePreset!=='custom'){
document.querySelectorAll('.resolution').forEach(r=>{
const size=parseInt(r.dataset.size);
r.classList.toggle('active',presets[activePreset].includes(size));
});
}
});
});

resolutionGroup.addEventListener('click',(e)=>{
if(e.target.classList.contains('resolution')){
e.target.classList.toggle('active');
activePreset='custom';
presetBtns.forEach(b=>b.classList.remove('active'));
document.querySelector('.preset-btn[data-preset=custom]').classList.add('active');
}
});

function handleFile(file){
if(!file.type.startsWith('image/')){
resultMsg.className='result-msg error';
resultMsg.textContent='Unsupported file type';
return;
}
const reader=new FileReader();
reader.onload=function(e){
const img=new Image();
img.onload=function(){
currentImage=img;
const canvas=document.createElement('canvas');
canvas.width=img.width;canvas.height=img.height;
const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
currentImageData=ctx.getImageData(0,0,img.width,img.height);
uploadZone.classList.add('has-image');
uploadZone.querySelector('.upload-icon').style.display='none';
uploadZone.querySelector('.upload-text').textContent=file.name;
uploadZone.querySelector('.upload-hint').textContent=`${img.width}x${img.height} · ${(file.size/1024).toFixed(1)} KB`;
updatePreview(img);
convertBtn.disabled=false;
resultMsg.textContent='';
icoPreviewGrid.innerHTML='';
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}

function updatePreview(img){
previewArea.innerHTML=`
<img class="preview-image" src="${img.src}" alt="Preview">
<div class="preview-info">${img.naturalWidth} x ${img.naturalHeight}</div>`;
}

function getSelectedSizes(){
const sizes=[];
document.querySelectorAll('.resolution.active').forEach(r=>sizes.push(parseInt(r.dataset.size)));
return sizes;
}

function imageToCanvas(width,height){
const c=document.createElement('canvas');
c.width=width;c.height=height;
const ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality='high';
ctx.drawImage(currentImage,0,0,width,height);
return c;
}

function canvasToBMPDIB(canvas,size){
const ctx=canvas.getContext('2d');
const imgData=ctx.getImageData(0,0,size,size);
const pixels=imgData.data;

const rowBytes=Math.floor((size*32+31)/32)*4;
const pixelDataSize=rowBytes*size;
const andRowBytes=Math.floor((size*1+31)/32)*4;
const andDataSize=andRowBytes*size;

const dibSize=40+pixelDataSize+andDataSize;
const buffer=new ArrayBuffer(dibSize);
const dv=new DataView(buffer);
let offset=0;

dv.setUint32(offset,40,true);offset+=4;
dv.setInt32(offset,size,true);offset+=4;
dv.setInt32(offset,size*2,true);offset+=4;
dv.setUint16(offset,1,true);offset+=2;
dv.setUint16(offset,32,true);offset+=2;
dv.setUint32(offset,0,true);offset+=4;
dv.setUint32(offset,pixelDataSize+andDataSize,true);offset+=4;
dv.setInt32(offset,0,true);offset+=4;
dv.setInt32(offset,0,true);offset+=4;
dv.setUint32(offset,0,true);offset+=4;
dv.setUint32(offset,0,true);offset+=4;

for(let y=size-1;y>=0;y--){
const rowStart=offset;
for(let x=0;x<size;x++){
const pi=(y*size+x)*4;
dv.setUint8(offset++,pixels[pi+2]);
dv.setUint8(offset++,pixels[pi+1]);
dv.setUint8(offset++,pixels[pi]);
dv.setUint8(offset++,pixels[pi+3]);
}
while((offset-rowStart)<rowBytes)offset++;
}

for(let y=0;y<size;y++){
const rowStart=offset;
for(let x=0;x<Math.ceil(size/8);x++)dv.setUint8(offset++,0);
while((offset-rowStart)<andRowBytes)offset++;
}

return new Uint8Array(buffer);
}

function buildICO(sizes){
const canvases=sizes.map(s=>imageToCanvas(s,s));
const dibDatas=canvases.map((c,i)=>canvasToBMPDIB(c,sizes[i]));

let imgOffset=6+sizes.length*16;
const entries=[];
sizes.forEach((size,i)=>{
const s=(size>=256)?0:size;
entries.push({
width:s,height:s,palette:0,reserved:0,
colorPlanes:1,bpp:32,
dataSize:dibDatas[i].length,
offset:imgOffset
});
imgOffset+=dibDatas[i].length;
});

const totalSize=imgOffset;
const buffer=new ArrayBuffer(totalSize);
const dv=new DataView(buffer);
let off=0;

dv.setUint16(off,0,true);off+=2;
dv.setUint16(off,1,true);off+=2;
dv.setUint16(off,sizes.length,true);off+=2;

entries.forEach(e=>{
dv.setUint8(off,e.width);off+=1;
dv.setUint8(off,e.height);off+=1;
dv.setUint8(off,e.palette);off+=1;
dv.setUint8(off,e.reserved);off+=1;
dv.setUint16(off,e.colorPlanes,true);off+=2;
dv.setUint16(off,e.bpp,true);off+=2;
dv.setUint32(off,e.dataSize,true);off+=4;
dv.setUint32(off,e.offset,true);off+=4;
});

dibDatas.forEach(data=>{
new Uint8Array(buffer).set(data,off);
off+=data.length;
});

return new Blob([buffer],{type:'image/x-icon'});
}

function showIcoPreview(sizes,blob){
icoPreviewGrid.innerHTML='';
const url=URL.createObjectURL(blob);
sizes.forEach(size=>{
const item=document.createElement('div');
item.className='ico-preview-item';
const img=document.createElement('img');
img.src=url;
img.width=Math.min(size,64);
img.height=Math.min(size,64);
const label=document.createElement('span');
label.textContent=`${size}x${size}`;
item.appendChild(img);item.appendChild(label);
icoPreviewGrid.appendChild(item);
});
}

convertBtn.addEventListener('click',()=>{
if(!currentImage)return;
const sizes=getSelectedSizes();
if(sizes.length===0){
resultMsg.className='result-msg error';
resultMsg.textContent='Select at least one resolution';
return;
}
try{
const blob=buildICO(sizes);
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='favicon.ico';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);

resultMsg.className='result-msg success';
resultMsg.textContent=`ICO generated — ${sizes.length} sizes [${sizes.join(', ')}] · ${(blob.size/1024).toFixed(1)} KB`;
showIcoPreview(sizes,blob);
}catch(e){
resultMsg.className='result-msg error';
resultMsg.textContent='Conversion failed: '+e.message;
}
});

resetBtn.addEventListener('click',()=>{
currentImage=null;currentImageData=null;
convertBtn.disabled=true;
resultMsg.textContent='';
icoPreviewGrid.innerHTML='';
uploadZone.classList.remove('has-image');
uploadZone.querySelector('.upload-icon').style.display='';
uploadZone.querySelector('.upload-text').textContent='DROP IMAGE HERE';
uploadZone.querySelector('.upload-hint').textContent='或点击选择文件';
fileInput.value='';
previewArea.innerHTML='<div class="placeholder">Preview Area</div>';
presetBtns.forEach(b=>b.classList.remove('active'));
document.querySelector('.preset-btn[data-preset=standard]').classList.add('active');
document.querySelectorAll('.resolution').forEach(r=>{
const size=parseInt(r.dataset.size);
r.classList.toggle('active',presets.standard.includes(size));
});
activePreset='standard';
});

const bgOverlay=document.getElementById('bgOverlay');
const img=new Image();
img.src='main.jpg';
img.onload=()=>{gsap.to(bgOverlay,{opacity:1,duration:1.2,ease:'power2.out'});bgOverlay.classList.add('loaded')};
img.onerror=()=>{bgOverlay.classList.add('loaded')};

gsap.fromTo('.header',{opacity:0,y:-30},{opacity:1,y:0,duration:0.8,ease:'power3.out'});
gsap.fromTo('.hero>*',{opacity:0,y:20},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:'power2.out',delay:0.3});
gsap.fromTo('.converter-area>*',{opacity:0,y:20},{opacity:1,y:0,duration:0.5,stagger:0.1,ease:'power2.out',delay:0.5});
gsap.fromTo('.resolution-section',{opacity:0,y:20},{opacity:1,y:0,duration:0.5,ease:'power2.out',delay:0.7});
gsap.fromTo('.action-bar',{opacity:0,y:20},{opacity:1,y:0,duration:0.5,ease:'power2.out',delay:0.8});
gsap.fromTo('.footer',{opacity:0,y:20},{opacity:1,y:0,duration:0.6,ease:'power2.out',delay:1});
})();
</script>
</body>
</html>
